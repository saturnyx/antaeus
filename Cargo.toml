[package]
name = "antaeus"
version = "0.3.10"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Harshal<saturnyx@disroot.org"]
description = "A Versatile Framework for Vexide"
repository = "https://github.com/Saturnyx/antaeus"
categories = ["science::robotics"]
keywords = ["Robotics", "bindings", "vex", "v5"]

[lib]
name = "antaeus"
doctest = false

[features]
default = ["graphics"]
graphics = ["dep:mousefood", "dep:ratatui", "dep:embedded-graphics-core"]
legacy = []

[dependencies]
embedded-graphics-core = { version = "0.4.1", optional = true }
csv = "1.4.0"
humantime = "2.4.0"
log = "0.4.33"
mousefood = { version = "0.5.2", optional = true }
ratatui = { version = "0.30.2", default-features = false, optional = true }
snafu = "0.9.2"
vex-sdk = "0.28.0"
vexide = { version = "0.8.0", features = ["full"] }
vexide-motorgroup = "2.2.0"

[dev-dependencies]
embedded-graphics-simulator = "0.8.0"
vexide = { version = "0.8.0", features = ["full", "vex-sdk-mock"] }
plotly = "0.14.1"
rand = "0.10.2"
rand_distr = "0.6.0"
getrandom = { version = "^0.4.3" }
tempfile = "3.27.0"
